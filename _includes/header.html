<div class="header">
  <h1 class="title">{{site.data.data.name}}</h1>
  <div class="header-controls">
    <div class="language-switcher">
      <button id="lang-en" class="lang-btn" onclick="switchLanguage('en')">EN</button>
      <button id="lang-ru" class="lang-btn" onclick="switchLanguage('ru')">RU</button>
    </div>
    <input type="checkbox" name="mode" id="switch">
    <label for="switch"><i id="moon" data-feather="sun" fill="var(--fg-color-dark)"></i></label>
  </div>
</div>
